function remote(){return `<div class="panel"><b>REMOTE CONTROL</b><div class="remote"><button onclick="remoteCh(1)">CH 001</button><button onclick="remoteCh(404)">CH 404</button><button onclick="remoteCh(666)">CH 666</button><button onclick="remoteCh(0)">CH 000</button><button onclick="remoteCh(999)">CH ???</button><button onclick="flash('VOL −')">VOL −</button><button onclick="flash('VOL +')">VOL +</button><button onclick="flash('BRIGHT −')">BRIGHT −</button><button onclick="flash('BRIGHT +')">BRIGHT +</button><button onclick="secret('INPUT')">INPUT</button></div></div>`}
function audio(){return `<div class="panel"><b>AUDIO LAB</b><div class="dim">Pitch · rhythm · stereo · DTMF · reversed sequence · radio noise</div><div class="actions"><button onclick="beep(220)">LOW</button><button onclick="beep(880)">HIGH</button><button onclick="dtmf()">DTMF</button><button onclick="rhythm()">RHYTHM</button><button onclick="stereo()">STEREO</button><button onclick="radio()">RADIO</button><button onclick="noise()">INTERFERENCE</button></div><canvas id="wave" class="graph" width="900" height="120"></canvas></div>`}
let AC;function ctx(){return AC||(AC=new(window.AudioContext||window.webkitAudioContext)())}function tone(f,t=0,p=0){let a=ctx(),o=a.createOscillator(),g=a.createGain(),s=a.createStereoPanner?s=a.createStereoPanner():null;o.frequency.value=f;o.type="sine";g.gain.setValueAtTime(.0001,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.12,a.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t+.28);o.connect(s||g);if(s){s.pan.value=p;s.connect(g)}g.connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+.31)}function beep(f=440){tone(f);wave("tone")}function dtmf(){tone(697,0,-.4);tone(1209,0,.4);wave("dtmf")}function rhythm(){[0,.25,.75,1].forEach(t=>tone(440,t));wave("rhythm")}function stereo(){tone(330,0,-1);tone(660,.4,1);wave("stereo")}function radio(){[220,330,550,440,660].forEach((f,i)=>tone(f,i*.22));wave("radio")}function wave(m){let c=$("#wave");if(!c)return;let x=c.getContext("2d");x.fillStyle="#000";x.fillRect(0,0,c.width,c.height);x.strokeStyle="#bbb";x.beginPath();for(let i=0;i<c.width;i++){let y=60;if(m==="tone")y+=Math.sin(i*.1)*35;if(m==="dtmf")y+=Math.sin(i*.19)*18+Math.sin(i*.31)*15;if(m==="rhythm")y+=(i%100<35?Math.sin(i*.25)*30:0);if(m==="stereo")y+=Math.sin(i*.07)*18+(i%80<20?20:-20);if(m==="radio")y+=(Math.random()-.5)*40+Math.sin(i*.035)*25;x.lineTo(i,y)}x.stroke()}function noise(){let a=ctx(),b=a.createBuffer(1,a.sampleRate*.5,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.3;let s=a.createBufferSource(),g=a.createGain();s.buffer=b;g.gain.value=.4;s.connect(g);g.connect(a.destination);s.start();$("#noise").classList.add("on");setTimeout(()=>$("#noise").classList.remove("on"),900)}
function flash(t){$("#osd").textContent=t;setTimeout(render,700)}function remoteCh(n){if(n===0)return secret("000");if(n===404)return secret("404");if(n===666)return secret("666");if(n===999)return secret("???");level=n;render()}
function render(){level=Math.max(1,Math.min(500,level));sessionStorage.setItem("v7level",level);let l=cur();$("#osd").textContent=`CH ${String(level).padStart(3,"0")} / 500 · ${l.kind}`;$("#bar").style.width=level/5+"%";let e=remote();if([17,43,88,119,177,222,267,309,344,388,421,467].includes(level))e+=audio();if(level%25===0)e+=`<div class="panel"><button onclick="noise()">TRIGGER INTERFERENCE</button></div>`;if(level===500)e+=`<div class="panel"><div class="bigend" onclick="finalScreen()">TRANSMISSION COMPLETE</div></div>`;$("#content").innerHTML=art(level)+`<div class="osd">TRANSMISSION ${String(level).padStart(3,"0")}</div><h1>${esc(l.title)}</h1><div class="kind">${esc(l.kind)}</div><div class="clue">${esc(clue())}</div>${e}<div class="panel"><input id="answerInput" placeholder="ENTER SIGNAL" onkeydown="if(event.key==='Enter')check()"><div class="actions"><button onclick="check()">TRANSMIT</button></div><div id="msg" class="msg"></div></div>`;clearTimeout(idleTimer);idleTimer=setTimeout(()=>{noise();flash("UNAUTHORIZED SIGNAL DETECTED")},30000)}
function check(){let v=norm($("#answerInput").value);if(v===norm(ADMIN_CODE)){openAdmin();return}if(v===norm(ans())){$("#msg").textContent="SIGNAL ACCEPTED.";noise();setTimeout(()=>{if(level<500){level++;render()}else finalScreen()},550)}else $("#msg").textContent="SIGNAL REJECTED."}
function jump(n){level=Math.max(1,Math.min(500,level+n));render()}function jumpToInput(){let n=Number($("#jumpInput").value);if(n>=1&&n<=500){level=n;render()}}function openAdmin(){$("#admin").classList.remove("hidden");showAdminAnswer()}function closeAdmin(){$("#admin").classList.add("hidden")}function showAdminAnswer(){$("#adminAnswer").textContent="ANSWER: "+ans()}function changeAnswer(){let v=prompt("New answer:",ans());if(v!==null){overrides[level]={...(overrides[level]||{}),answer:v};render();openAdmin()}}function changeQuestion(){let v=prompt("New question:",clue());if(v!==null){overrides[level]={...(overrides[level]||{}),clue:v};render();openAdmin()}}

function secret501(){$("#modalbox").innerHTML=`<h2>CH ??? — UNAUTHORIZED SIGNAL</h2><p>Find the single different pixel.</p><canvas id="sc" width="700" height="260" class="graph"></canvas><div id="sm" class="msg"></div>`;let c=$("#sc"),x=c.getContext("2d"),sx=347,sy=128;x.fillStyle="#777";x.fillRect(0,0,700,260);for(let y=0;y<260;y+=4)for(let q=0;q<700;q+=4){x.fillStyle="#888";x.fillRect(q,y,3,3)}x.fillStyle="#fff";x.fillRect(sx,sy,3,3);c.onclick=e=>{let r=c.getBoundingClientRect(),px=(e.clientX-r.left)*c.width/r.width,py=(e.clientY-r.top)*c.height/r.height;if(Math.abs(px-sx)<10&&Math.abs(py-sy)<10)$("#sm").textContent="UNAUTHORIZED CHANNEL OPENED: PIPICORNI.TIKTOK";}}
