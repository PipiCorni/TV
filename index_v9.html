function art(seed){

    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-label="CRT transmission image">
      <rect width="1000" height="245" fill="#08090a"/>
      <g opacity=".22" stroke="#d6d9dc">`;

  out+=`</g><g fill="none" stroke="#c8cbce" stroke-width="2">`;
  for(let x=0;x<w;x+=4){
    const yy=122+Math.sin(x/19+seed*.37)*34+Math.sin(x/7+seed)*9;
    out+=`<line x1="${x}" y1="${yy}" x2="${x+4}" y2="${122+Math.sin((x+4)/19+seed*.37)*34+Math.sin((x+4)/7+seed)*9}"/>`;
  }

  for(let i=0;i<90;i++){
    const x=(i*83+seed*17)%w,y=(i*47+seed*29)%h;
    out+=`<rect x="${x}" y="${y}" width="${(i%3)+1}" height="${(i%2)+1}"/>`;
  }
  out+=`</g><rect x="18" y="18" width="235" height="34" fill="#050606" stroke="#8c9195"/>

let AC;function ctx(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();return AC}function tone(f,t=0,p=0){let a=ctx(),o=a.createOscillator(),g=a.createGain(),s=a.createStereoPanner?s=a.createStereoPanner():null;o.frequency.value=f;o.type="sine";g.gain.setValueAtTime(.0001,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.12,a.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t+.28);o.connect(s||g);if(s){s.pan.value=p;s.connect(g)}g.connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+.31)}function beep(f=440){tone(f);wave("tone")}function dtmf(){tone(697,0,-.4);tone(1209,0,.4);wave("dtmf")}function rhythm(){[0,.25,.75,1].forEach(t=>tone(440,t));wave("rhythm")}function stereo(){tone(330,0,-1);tone(660,.4,1);wave("stereo")}function radio(){[220,330,550,440,660].forEach((f,i)=>tone(f,i*.22));wave("radio")}function wave(m){let c=$("#wave");if(!c)return;let x=c.getContext("2d");x.fillStyle="#000";x.fillRect(0,0,c.width,c.height);x.strokeStyle="#bbb";x.beginPath();for(let i=0;i<c.width;i++){let y=60;if(m==="tone")y+=Math.sin(i*.1)*35;if(m==="dtmf")y+=Math.sin(i*.19)*18+Math.sin(i*.31)*15;if(m==="rhythm")y+=(i%100<35?Math.sin(i*.25)*30:0);if(m==="stereo")y+=Math.sin(i*.07)*18+(i%80<20?20:-20);if(m==="radio")y+=(Math.random()-.5)*40+Math.sin(i*.035)*25;x.lineTo(i,y)}x.stroke()}function noise(){let a=ctx(),b=a.createBuffer(1,a.sampleRate*.5,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.3;let s=a.createBufferSource(),g=a.createGain();s.buffer=b;g.gain.value=.4;s.connect(g);g.connect(a.destination);s.start();$("#noise").classList.add("on");setTimeout(()=>$("#noise").classList.remove("on"),900)}

(function(){
  const p=$("#admin"),h=$("#adminHead"),rh=$("#resizeHandle");
  let drag=false,dx=0,dy=0,resize=false,rw=0,rh0=0,rx=0,ry=0;
  h.addEventListener("pointerdown",e=>{
    if(e.target.closest("button")) return;
    drag=true;dx=e.clientX-p.offsetLeft;dy=e.clientY-p.offsetTop;h.setPointerCapture(e.pointerId);
  });

    if(!drag)return;
    p.style.left=Math.max(0,Math.min(innerWidth-p.offsetWidth,e.clientX-dx))+"px";
    p.style.top=Math.max(0,Math.min(innerHeight-p.offsetHeight,e.clientY-dy))+"px";
  });
  h.addEventListener("pointerup",()=>drag=false);
  h.addEventListener("pointercancel",()=>drag=false);
  rh.addEventListener("pointerdown",e=>{
    resize=true;rw=p.offsetWidth;rh0=p.offsetHeight;rx=e.clientX;ry=e.clientY;rh.setPointerCapture(e.pointerId);e.preventDefault();
  });
  rh.addEventListener("pointermove",e=>{
    if(!resize)return;
    const nw=Math.max(280,Math.min(innerWidth*.9,rw+e.clientX-rx));
    const nh=Math.max(250,Math.min(innerHeight*.82,rh0+e.clientY-ry));
    p.style.width=nw+"px";p.style.height=nh+"px";
  });
  rh.addEventListener("pointerup",()=>resize=false);
  rh.addEventListener("pointercancel",()=>resize=false);
})();render();
